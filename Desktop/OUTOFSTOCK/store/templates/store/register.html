{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | OUTOFSTOCK</title>
  <link rel="stylesheet" href="{% static 'store/css/shared.css' %}">
  <link rel="stylesheet" href="{% static 'store/css/login.css' %}">
</head>
<body class="theme-light inner-page-body">
  <div class="noise"></div>
  <div class="cursor-glow"></div>

  <header class="site-header">
    <a href="{% url 'home' %}" class="logo">OUTOFSTOCK</a>
    <nav class="main-nav">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'products' %}">Collection</a>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}" class="active-link">Register</a>
    </nav>
  </header>

  <div class="ticker-wrap">
    <div class="ticker-track">
      <span>NEW USER REGISTRATION</span><span class="dot-sep">&#9670;</span>
      <span>FORM VALIDATION ACTIVE</span><span class="dot-sep">&#9670;</span>
      <span>CHOOSE YOUR ROLE</span><span class="dot-sep">&#9670;</span>
    </div>
  </div>

  <main class="inner-page auth-page">
    <section class="auth-card-wrap single-wide">
      <div class="auth-card wide-card">
        <p class="section-label">CREATE ACCOUNT</p>
        <h1>Register</h1>

        {% if error %}
          <p style="color:#e02020;margin-top:0.5rem;">{{ error }}</p>
        {% endif %}

        <form class="auth-form two-column-form" method="POST" action="{% url 'register' %}">
          {% csrf_token %}
          <label>Email
            <input name="email" type="email" placeholder="you@example.com" />
          </label>
          <label>Username
            <input name="username" type="text" placeholder="choose a username" />
          </label>
          <label>Password
            <input name="password" type="password" placeholder="at least 6 characters" />
          </label>
          <label>Account type
            <select name="role">
              <option value="buyer">Buyer</option>
              <option value="seller">Seller</option>
            </select>
          </label>
          <button type="submit" class="action-btn auth-btn">Create Account</button>
        </form>

        <p class="auth-switch" style="margin-top:1rem;">
          Already have an account? <a href="{% url 'login' %}" class="auth-switch-link">Log in here</a>
        </p>
      </div>
    </section>
  </main>

  <script src="{% static 'store/js/shared.js' %}"></script>
  <script src="{% static 'store/js/register.js' %}"></script>
</body>
</html>
